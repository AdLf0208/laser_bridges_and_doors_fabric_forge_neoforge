[package]
# Port of Laser Bridges & Doors 6.3 (Mars-The-Planet/Laser-Bridges-And-Doors, MIT).
# Cargo's package name and version are not the mod's identity: `horizon-mod.toml` is.
name = "laserbridges"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Laser Bridges & Doors for Horizon: redstone-powered laser sources that build bridges, doors and fences out of light"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
